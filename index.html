 if(opt===item){score++;btn.classList.add('correct');fb.textContent='Correct! Well done.';fb.className='feedback ok';}
 else{btn.classList.add('wrong');fb.textContent='Incorrect. Correct answer: '+item.vi+'.';fb.className='feedback no';[...choices.children].forEach((b,k)=>{if(options[k]===item)b.classList.add('correct')})}
 [...choices.children].forEach(b=>b.disabled=true);update();});
 choices.appendChild(btn);});quiz.appendChild(section);});
 update();
}
function update(){
 document.getElementById('progressText').textContent=answered+' / '+items.length+' answered';document.getElementById('bar').style.width=(answered/items.length*100)+'%';
 document.getElementById('result').textContent='Score: '+score+' / '+items.length;
 document.getElementById('finalText').textContent=answered===items.length?'Quiz complete! Final score: '+score+' / '+items.length:'Answer each question once. Your score updates automatically.';
 document.querySelectorAll('.question').forEach((q,i)=>q.classList.toggle('active',i===activeIndex));
 document.getElementById('questionStatus').textContent=answered===items.length&&activeIndex===items.length-1?'Quiz complete!':'Question '+(activeIndex+1)+' of '+items.length;
 document.getElementById('prevBtn').disabled=activeIndex===0;document.getElementById('nextBtn').disabled=!locked.has(activeIndex)||activeIndex===items.length-1;
}
document.getElementById('reset').addEventListener('click',render);
document.getElementById('prevBtn').addEventListener('click',()=>{if(activeIndex>0){activeIndex--;update();window.scrollTo({top:0,behavior:'smooth'})}});
document.getElementById('nextBtn').addEventListener('click',()=>{if(locked.has(activeIndex)&&activeIndex<items.length-1){activeIndex++;update();window.scrollTo({top:0,behavior:'smooth'})}});
document.getElementById('topBtn').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));render();
</script></body></html>
